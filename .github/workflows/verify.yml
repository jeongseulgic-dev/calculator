name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Check site consistency (HTML balance, sidebar links, label-for, internal links, sitemap)
        run: python scripts/verify_site.py
